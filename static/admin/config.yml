backend:
  name: github
  repo: analisiaid/analisiablog
  branch: main
  base_url: https://analisia-blog-oauth.analisia-id.workers.dev
  auth_endpoint: api/oauth/auth

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Blog Posts"
    label_singular: "Post"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    preview_path: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Slug", name: "slug", widget: "string", hint: "URL path segment. Use lowercase with hyphens."}
      - {label: "Description", name: "description", widget: "string", hint: "SEO meta description, max 155 characters"}
      - {label: "Body", name: "body", widget: "markdown"}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Categories", name: "categories", widget: "list", required: false}
      - {label: "Author", name: "author", widget: "string", required: false}
      - {label: "Author Title", name: "author_title", widget: "string", required: false, hint: "e.g. Head of Paid Media"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Cover Image", name: "cover", widget: "image", required: false}
      - {label: "Featured", name: "featured", widget: "boolean", default: false, required: false}
      - {label: "Show TOC", name: "toc", widget: "boolean", default: true, required: false}
      - {label: "Reading Time", name: "readingTime", widget: "boolean", default: true, required: false}
      - {label: "Draft", name: "draft", widget: "boolean", default: false, required: false}

  - name: "pages"
    label: "Pages"
    folder: "content"
    create: false
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Type", name: "type", widget: "string", hint: "Use 'about' or 'subscribe' to apply custom layout"}
      - {label: "Description", name: "description", widget: "string"}
      - {label: "Body", name: "body", widget: "markdown"}
