{{ define "main" }}
<div class="page-wrapper">
  <div class="about-page">
    <header class="about-header">
      <div class="about-badge">{{ i18n "about_badge" }}</div>
      <h1 class="about-heading">{{ i18n "about_heading" }}</h1>
      <p class="about-desc">{{ i18n "about_desc" }}</p>

    <div class="about-body">
      {{ .Content }}
    </div>
  </div>
</div>
{{ end }}
