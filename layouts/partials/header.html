<nav class="navbar">
  <div class="navbar-logo">
    <div class="navbar-logo-mark">A</div>
    <span class="navbar-logo-text">{{ .Site.Title }}</span>
  </div>

  <div class="navbar-links">
    {{ $currentPage := . }}
    {{ range .Site.Menus.main }}
    <a href="{{ .URL }}" class="navbar-link{{ if or ($currentPage.IsMenuCurrent "main" .) ($currentPage.HasMenuCurrent "main" .) }} active{{ end }}">
      {{ .Name }}
    </a>
    {{ end }}
  </div>

  <div class="navbar-actions">
    {{ partial "lang-switcher" . }}

    <a href="{{ relLangURL "berlangganan" }}" class="navbar-cta">
      <span>{{ i18n "subscribe_cta" }}</span>
      <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </a>

    <button class="navbar-hamburger" onclick="this.closest('.navbar').classList.toggle('nav-open')" aria-label="Menu">
      <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
  </div>
</nav>
