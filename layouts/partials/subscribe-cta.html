<div class="subscribe-cta-block">
  <h3 class="subscribe-cta-heading">{{ i18n "subscribe_cta_headline" | default "Dapatkan taktik seperti ini tiap minggu" }}</h3>
  <p class="subscribe-cta-desc">{{ i18n "subscribe_cta_desc" | default "Digest mingguan performance marketing, langsung ke inbox kamu." }}</p>
  <form class="subscribe-cta-form" action="{{ relLangURL "berlangganan" }}" method="get">
    <input type="email" class="subscribe-cta-input" placeholder="{{ i18n "subscribe_placeholder" }}" name="email" required>
    <button type="submit" class="subscribe-cta-button">{{ i18n "subscribe_button" }}</button>
  </form>
</div>
