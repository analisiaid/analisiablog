<article class="featured-card">
  <a href="{{ .RelPermalink }}" class="featured-card-link">
    {{ with .Params.cover }}
    <div class="featured-card-cover" style="background-image: url('{{ . | absURL }}');"></div>
    {{ end }}
    <div class="featured-card-body">
      {{ with .Params.categories }}
      {{ range first 1 . }}
      <span class="featured-card-category">{{ . }}</span>
      {{ end }}
      {{ end }}
      <h2 class="featured-card-title">{{ .Title }}</h2>
      <p class="featured-card-desc">{{ .Params.description }}</p>
      <div class="featured-card-meta">
        <span class="featured-card-author">{{ with .Params.author }}{{ . }}{{ end }}</span>
        <span class="featured-card-meta-sep">·</span>
        <span class="featured-card-reading">{{ .ReadingTime }} {{ i18n "minute_read" }}</span>
      </div>
    </div>
  </a>
</article>
