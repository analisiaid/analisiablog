<article class="post-row">
  <a href="{{ .RelPermalink }}" class="post-row-link">
    <div class="post-row-category">
      {{ with .Params.categories }}{{ index . 0 }}{{ end }}
    </div>
    <h3 class="post-row-title">{{ .Title }}</h3>
    <div class="post-row-author">
      {{ with .Params.author }}{{ . }}{{ end }}
    </div>
    <div class="post-row-date">
      {{ .Date.Format "Jan 2, 2006" }}
    </div>
    <div class="post-row-reading">
      {{ if .ReadingTime }}{{ .ReadingTime }} {{ i18n "min_read" }}{{ end }}
    </div>
    <div class="post-row-arrow">
      <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="7" y1="17" x2="17" y2="7"></line>
        <polyline points="7 7 17 7 17 17"></polyline>
      </svg>
    </div>
  </a>
</article>
