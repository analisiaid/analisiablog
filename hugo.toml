baseURL = "https://blog.analisia.id"
defaultContentLanguage = "en"
title = "Analisia Blog"

disableKinds = []

[params]
  brandAccent = "#FF4C1E"
  brandAccentLight = "#fff1ed"
  brandAccentBorder = "#ffd9ce"
  textPrimary = "#111111"
  textSecondary = "#666666"
  textMuted = "#999999"
  border = "#e5e5e5"
  background = "#ffffff"
  fontHeading = "Plus Jakarta Sans"
  fontBody = "Inter"
  fontCode = "JetBrains Mono"
  maxContentWidth = "680px"
  tocWidth = "260px"
  pageMaxWidth = "1200px"

[permalinks]
  posts = "/:slug/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[outputFormats]
  [outputFormats.RSS]
    mediatype = "application/rss"
    baseName = "feed"
